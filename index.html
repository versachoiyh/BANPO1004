<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BANPO1004</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#f4f4f4; }
    #viewer { position:fixed; inset:0; width:100%; height:100%; }
    #title {
      position:fixed; top:14px; left:18px; z-index:5;
      font:600 15px/1.2 Arial, sans-serif; color:#333;
      background:rgba(255,255,255,.78); padding:7px 10px; border-radius:6px;
      pointer-events:none;
    }
    #status {
      position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
      z-index:6; font:14px Arial,sans-serif; color:#555;
      background:rgba(255,255,255,.9); padding:10px 14px; border-radius:7px;
      pointer-events:none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/online-3d-viewer@0.18.0/build/o3dv.min.js"></script>
</head>
<body>
  <div id="viewer"></div>
  <div id="title">BANPO1004</div>
  <div id="status">3D 모델 불러오는 중…</div>

  <script>
    window.addEventListener('load', function () {
      const status = document.getElementById('status');
      const parent = document.getElementById('viewer');

      const viewer = new OV.EmbeddedViewer(parent, {
        backgroundColor: new OV.RGBAColor(244, 244, 244, 255),
        defaultColor: new OV.RGBColor(225, 225, 225),
        edgeSettings: new OV.EdgeSettings(
          true,
          new OV.RGBColor(45, 45, 45),
          20
        ),
        onModelLoaded: function () {
          status.style.display = 'none';
        },
        onModelLoadFailed: function () {
          status.textContent = 'BANPO1004.3ds 파일을 불러오지 못했습니다.';
        }
      });

      viewer.LoadModelFromUrlList(['./BANPO1004.3ds']);

      window.addEventListener('resize', function () {
        viewer.Resize();
      });
    });
  </script>
</body>
</html>
